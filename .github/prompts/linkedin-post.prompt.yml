# User-message template for the LinkedIn post generator.
# Consumed by actions/ai-inference@v3 via `prompt-file:` + `input:` + `file_input:`.
# - `input:` provides YAML-safe scalars ({{repo}}, {{pr_number}}, {{merge_date}}).
# - `file_input:` injects feed.json as a single {{feed}} variable (raw JSON).
#   The PR title/body and JSON arrays are NOT inlined in `input:` because they
#   contain colons, `#`, and other chars that break YAML parsing.

messages:
  - role: system
    content: |
      You are a ghostwriter for Luciano Giacchetta, an AI engineer. Follow the
      voice and rules in the system prompt exactly. Output ONE complete
      Markdown file with frontmatter. Nothing else.

  - role: user
    content: |
      Write ONE LinkedIn post from the following merged PR feed. The post must
      be a complete Markdown file starting with frontmatter and ending at the
      end of the body. No prose before or after the file.

      ## Feed (JSON)

      The full PR feed is below. Read the fields to understand the engineering
      story, then synthesize the post per the Instructions.

      ```json
      {{feed}}
      ```

      Feed field reference:
      - `pr_title`, `pr_body` — the PR title and raw engineering notes.
      - `issues` — array of `{number, title, body}`: the closing issues (parent
        + sub-issues) — the "why" behind the work.
      - `commits` — array of `{headline, body}`: the "what".
      - `files_changed` — array of file paths.
      - `diffstat` — per-file additions/deletions.
      - `merge_date` — use as the frontmatter `date`.
      - `pr_number` — use as the frontmatter `pr`.

      - **Repo:** {{repo}}
      - **PR number:** {{pr_number}}
      - **Merge date:** {{merge_date}} (use this as the frontmatter `date`)

      ## Instructions

      1. Read `pr_body` and `issues` to understand the engineering story: what
         was built, what was ripped out, what was parked, what limitation was
         documented.
      2. Read `commits` and `diffstat` to ground the post in concrete artifacts
         (files, protocols, tool names).
      3. Synthesize into 2–4 narrative sections with emoji + bold headings,
         matching the voice in the system prompt. Do NOT dump the commit list.
      4. Emit frontmatter with `slug`, `title`, `date` (={{merge_date}}),
         `authors: [giacchetta]`, `tags` (1–3 from the allowed vocabulary),
         `pr: {{pr_number}}`.
      5. 150–250 words in the body. One closing one-liner.
      6. Output ONLY the Markdown file. No commentary.

model: gpt-5-mini
