name: Post on Merge

# Generate a LinkedIn-style post from a merged PR and open a pull request
# against the personal site (giacchetta/giacchetta.github.io) adding the post
# under /post/<YYYY-MM-DD>-<slug>.md. The repo's CODEOWNER reviews and merges
# the PR; the repo's static.yaml workflow rebuilds and deploys on push to main.
#
# One merged PR == one post. The PR's closing issues (parent + sub-issues)
# are gathered as narrative feed alongside the PR title/body/commits/diffstat.
#
# See .github/prompts/README.md for the prompt contract.

on:
  pull_request:
    types: [closed]

  # Manual backfill: regenerate a post from any past merged PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to generate a post from"
        required: true
        type: string

# Default token is enough for reading this repo; cross-repo push uses POSTS_PAT.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: post-on-merge-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  generate:
    # Only run on PRs merged into the default branch (or manual dispatch).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gh CLI is preinstalled on ubuntu-latest
        run: gh --version

      - name: Gather PR + linked issues feed
        id: gather
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          bash .github/scripts/gather-feed.sh > feed.json
          # Show a compact summary in the workflow log for debugging.
          jq '{pr_number, pr_title, repo, merge_date, issue_count: (.issues|length), commit_count: (.commits|length), files_changed: (.files_changed|length)}' feed.json
          # Expose the feed as a step output for the inference step. Use the
          # heredoc form so multi-line JSON survives intact into the output.
          {
            echo "feed<<EOF"
            cat feed.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run AI inference
        id: ai
        uses: actions/ai-inference@v3
        with:
          prompt-file: .github/prompts/linkedin-post.prompt.yml
          system-prompt-file: .github/prompts/linkedin-post.system.md
          model: auto
          # Only YAML-safe scalars go in `input:`. The PR title/body and JSON
          # arrays contain colons, `#`, and other chars that break YAML parsing
          # (the v3 failure on PR #14's merge: "bad indentation of a mapping
          # entry" at `pr_title: ci(post): ...`). The full feed is injected as a
          # single {{feed}} file variable via `file_input:` instead.
          input: |
            repo: "${{ github.repository }}"
            pr_number: ${{ fromJSON(steps.gather.outputs.feed).pr_number }}
            merge_date: "${{ fromJSON(steps.gather.outputs.feed).merge_date }}"
          file_input: |
            feed: feed.json
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GC_COPILOT_TOKEN }}

      # Clean the AI response (strip CRLF + leading/trailing code fences) and
      # derive the post's path/filename/title from the gather step's PR_TITLE +
      # MERGE_DATE — NOT by parsing the model's frontmatter. The model
      # occasionally injects code fences inside the frontmatter that crash
      # yaml.safe_load, so we stopped parsing the post for routing metadata
      # entirely. The frontmatter is left untouched; the CODEOWNER reviews the
      # PR before merge.
      - name: Prepare generated post
        id: post
        env:
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
          PR_TITLE: ${{ fromJSON(steps.gather.outputs.feed).pr_title }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_DATE: ${{ fromJSON(steps.gather.outputs.feed).merge_date }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-post.sh

      # Push the post to the personal site via a short-lived branch + pull
      # request (NOT a direct push to main). The repo's CODEOWNER reviews and
      # merges the PR; the repo's static.yaml workflow rebuilds and deploys on
      # push to main. Requires the GC_TOKEN secret (PAT with contents:write +
      # pull-requests:write on giacchetta/giacchetta.github.io).
      - name: Push post to personal site
        env:
          POSTS_PAT: ${{ secrets.GC_TOKEN }}
          POST_PATH: ${{ steps.post.outputs.path }}
          POST_FILENAME: ${{ steps.post.outputs.filename }}
          POST_TITLE: ${{ steps.post.outputs.title }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CLEANED_FILE: ${{ steps.post.outputs.cleaned_file }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash .github/scripts/push-post.sh

      - name: Print generated post to log
        if: always()
        env:
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
        run: |
          echo "::group::Generated post (raw model response)"
          if [ -n "$RESPONSE_FILE" ] && [ -f "$RESPONSE_FILE" ]; then
            cat "$RESPONSE_FILE"
          else
            echo "(no response file — ai-inference step did not produce output)"
          fi
          echo "::endgroup::"
